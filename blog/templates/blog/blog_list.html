{% extends 'blog/base.html'%}

{% block title %}Список блогов{% endblock %}

{% block content %}
{% include 'blog/header.html' %}
<h2>Список блогов</h2>
<ul class="list-group">
    {% for blog in blogs %}
    <li class="list-group-item">
        <a href="{% url 'blog:blog_detail' blog.pk %}">{{ blog.title }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
