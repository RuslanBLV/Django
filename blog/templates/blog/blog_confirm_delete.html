{% extends 'blog/base.html'%}

{% block title %}Удаление блога{% endblock %}

{% block content %}
{% include 'blog/header.html' %}
<h2>Удаление блога</h2>
<p>Вы уверены, что хотите удалить "{{ blog.title }}"</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Подтвердить</button>
    <a href="{% url 'blog:blog_list'%}" class="btn btn-primary">Отмена</a>
</form>
{% endblock %}
