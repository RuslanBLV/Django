{% extends 'blog/base.html'%}

{% block title %}Форма для блогов{% endblock %}

{% block content %}
{% include 'blog/header.html' %}
<h2>Форма для блогов</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog:blog_list'%}" class="btn btn-primary">Отмена</a>
</form>
{% endblock %}
