{% extends 'catalog/base.html'%}

{% block title %}Список продуктов{% endblock %}

{% block content %}
{% include 'catalog/header.html' %}
<h2>Список продуктов</h2>
<ul class="list-group">
    {% for prod in products %}
    <li class="list-group-item">
        <a href="{% url 'catalog:product_detail' prod.pk %}">{{ prod.name }}</a>
        цена: {{ prod.price }}
    </li>
    {% endfor %}
</ul>
{% endblock %}
