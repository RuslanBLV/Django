{% extends 'catalog/base.html'%}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
{% include 'catalog/header.html' %}
<h2>Удаление продукта</h2>
<p>Вы уверены, что хотите удалить "{{ product.name }}"</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Подтвердить</button>
    <a href="{% url 'catalog:product_list'%}" class="btn btn-primary">Отмена</a>
</form>
{% endblock %}
